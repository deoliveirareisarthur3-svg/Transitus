<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transitus — Play</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 12px;
  background: #10121b;
  color: #f4f5ff;
  font-family: system-ui, sans-serif;
  text-align: center;
}

h1 { letter-spacing: 5px; margin-bottom: 6px; }
p { color: #aeb5d0; }

#status {
  font-weight: bold;
  margin: 18px;
  min-height: 24px;
}

#board {
  width: min(90vw, 480px);
  aspect-ratio: 1;
  margin: 20px auto;
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  grid-template-rows: repeat(8, minmax(0, 1fr));
  border: 3px solid #8793b4;
  border-radius: 5px;
  overflow: hidden;
}

.square {
  min-width: 0;
  min-height: 0;
  display: grid;
  place-items: center;
  cursor: pointer;
  position: relative;
}

.light { background: #d7dced; }
.dark { background: #596783; }

.piece {
  width: 76%;
  height: 76%;
  border-radius: 50%;
  box-shadow: 0 2px 5px #0005;
  pointer-events: none;
}

.white-piece {
  background: #fff;
  border: 3px solid #aab3ca;
}

.black-piece {
  background: #171923;
  border: 3px solid #8790a9;
}

.selected {
  box-shadow: inset 0 0 0 4px #818cff;
}

.legal::after {
  content: "";
  position: absolute;
  width: 22%;
  height: 22%;
  border-radius: 50%;
  background: #777fff;
  pointer-events: none;
}

button {
  background: #7b83ff;
  color: #10121b;
  border: 0;
  border-radius: 9px;
  padding: 12px 20px;
  font-weight: bold;
  cursor: pointer;
  margin: 8px;
}

a { color: #aab2ff; }
</style>
</head>
<body>

<h1>TRANSITUS</h1>
<p>Think ahead. Reach the other side.</p>
<div id="status" aria-live="polite">White's turn</div>
<div id="board" aria-label="Transitus game board"></div>
<button onclick="resetGame()">Restart Game</button>
<p><a href="index.html">Back to homepage</a></p>

<script>
const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");

let board = [];
let turn = "W";
let selected = null;
let gameOver = false;

let positionHistory = [];
let repetitionStarter = null;

function positionKey() {
  return board.map(piece => piece || "-").join("") + "|" + turn;
}

function resetGame() {
  board = Array(64).fill(null);

  for (let col = 0; col < 8; col++) {
    board[col] = "B";
    board[56 + col] = "W";
  }

  turn = "W";
  selected = null;
  gameOver = false;

  // Reset repetition tracking and record the starting position.
  positionHistory = [positionKey()];
  repetitionStarter = null;

  render();
}

function legalMoves(from) {
  const row = Math.floor(from / 8);
  const col = from % 8;
  const moves = [];

  const directions = turn === "W"
    ? [[-1, 0], [0, -1], [0, 1]]
    : [[1, 0], [0, -1], [0, 1]];

  for (const [dr, dc] of directions) {
    const nextRow = row + dr;
    const nextCol = col + dc;

    if (nextRow < 0 || nextRow > 7 ||
        nextCol < 0 || nextCol > 7) continue;

    const destination = nextRow * 8 + nextCol;

    if (board[destination] === null) {
      moves.push(destination);
    }
  }

  return moves;
}

function hasMoves(color) {
  for (let i = 0; i < 64; i++) {
    if (board[i] !== color) continue;

    const row = Math.floor(i / 8);
    const col = i % 8;

    const directions = color === "W"
      ? [[-1, 0], [0, -1], [0, 1]]
      : [[1, 0], [0, -1], [0, 1]];

    for (const [dr, dc] of directions) {
      const r = row + dr;
      const c = col + dc;

      if (r < 0 || r > 7 || c < 0 || c > 7) continue;

      if (board[r * 8 + c] === null) return true;
    }
  }

  return false;
}

function render() {
  boardEl.innerHTML = "";

  const targets = selected === null
    ? []
    : legalMoves(selected);

  for (let i = 0; i < 64; i++) {
    const row = Math.floor(i / 8);
    const col = i % 8;

    const square = document.createElement("div");
    square.className =
      "square " + ((row + col) % 2 === 0 ? "light" : "dark");

    if (i === selected) square.classList.add("selected");
    if (targets.includes(i)) square.classList.add("legal");

    if (board[i] !== null) {
      const piece = document.createElement("div");
      piece.className =
        "piece " +
        (board[i] === "W" ? "white-piece" : "black-piece");
      square.appendChild(piece);
    }

    square.addEventListener("click", () => clickSquare(i));
    boardEl.appendChild(square);
  }

  if (!gameOver) {
    statusEl.textContent =
      (turn === "W" ? "White" : "Black") + "'s turn";
  }
}

function clickSquare(index) {
  if (gameOver) return;

  if (
    selected !== null &&
    legalMoves(selected).includes(index)
  ) {
    const from = selected;
    const destinationRow = Math.floor(index / 8);
    const lastPlayer = turn;

    board[index] = board[from];
    board[from] = null;
    selected = null;

    // Reaching the opposite end wins immediately.
    if (
      (turn === "W" && destinationRow === 0) ||
      (turn === "B" && destinationRow === 7)
    ) {
      gameOver = true;
      render();
      statusEl.textContent =
        (turn === "W" ? "White" : "Black") + " wins!";
      return;
    }

    // Switch turns.
    turn = turn === "W" ? "B" : "W";

    // No-legal-moves rule: the last player to move loses.
    if (!hasMoves(turn)) {
      gameOver = true;
      render();

      const stuckName = turn === "W" ? "White" : "Black";
      const lastName = lastPlayer === "W" ? "White" : "Black";
      const winnerName = lastPlayer === "W" ? "Black" : "White";

      statusEl.textContent =
        stuckName + " has no legal moves. " +
        lastName + " loses! " + winnerName + " wins!";
      return;
    }

    // Record the new position, including whose turn it is.
    const key = positionKey();
    const previousOccurrences =
      positionHistory.filter(position => position === key).length;

    // The player who first causes a position to repeat starts
    // the repetition and is responsible under this rule.
    if (previousOccurrences === 1 && repetitionStarter === null) {
      repetitionStarter = lastPlayer;
    }

    positionHistory.push(key);

    // A position appearing for the third time ends the game.
    if (previousOccurrences >= 2) {
      gameOver = true;
      render();

      const loserName =
        repetitionStarter === "W" ? "White" : "Black";
      const winnerName =
        repetitionStarter === "W" ? "Black" : "White";

      statusEl.textContent =
        "Threefold repetition! " + loserName +
        ", who started the repetition, loses. " +
        winnerName + " wins!";
      return;
    }

    render();
    return;
  }

  selected = board[index] === turn ? index : null;
  render();
}

resetGame();
</script>
</body>
</html>
